<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap">
<style>
  /* Layout: full-bleed live 3D padel court; a gift voucher ("bon cadeau") ticket docks bottom-left once the box opens. */
  :root {
    --night: #0a1430;
    --night-2: #13224d;
    --ink: #f3f6ff;
    --muted: #a9b8de;
    --lime: #c6ff00;
    --gold: #f6c624;
    --paper: #f7f4ea;
    --paper-ink: #0a1430;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: #000;
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  body.revealed #stage canvas { cursor: grab; }
  body.dragging #stage canvas { cursor: grabbing; }

  .ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .ui > * { pointer-events: auto; }

  .head { display: grid; gap: 6px; max-width: 40rem; }
  .eyebrow {
    font-weight: 800; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--lime); text-shadow: 0 1px 8px rgba(0, 0, 0, .45);
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 400; line-height: .95;
    font-size: clamp(2.6rem, 9vw, 5.6rem); letter-spacing: .01em; text-wrap: balance;
    color: var(--ink); text-shadow: 0 4px 24px rgba(5, 10, 30, .55);
  }
  .head .intro, .head .surprise { transition: opacity .4s, transform .6s cubic-bezier(.2, 1.6, .4, 1); }
  .head .surprise { position: absolute; opacity: 0; transform: translateY(-40px) scale(.9); }
  body.phrase .head .intro { opacity: 0; transform: translateY(-20px); }
  body.revealed .head .intro { position: absolute; opacity: 0; transform: translateY(-20px); }
  body.revealed .head .surprise { position: static; opacity: 1; transform: none; transition-delay: .35s; }
  .head .surprise h1 { font-size: clamp(2.3rem, 8.4vw, 4.8rem); text-transform: uppercase; }
  .head .surprise h1 em { font-style: normal; color: var(--lime); }
  .head .surprise .eyebrow { font-size: .95rem; }

  .foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }

  .btn {
    font: 800 1rem/1 var(--body); letter-spacing: .04em;
    border: 0; border-radius: 999px; padding: 16px 26px; cursor: pointer;
    background: var(--lime); color: var(--night);
    box-shadow: 0 10px 30px rgba(198, 255, 0, .25), 0 2px 0 rgba(0, 0, 0, .25);
    transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible, .ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.open { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: none } 76% { transform: rotate(-3deg) scale(1.04) } 84% { transform: rotate(3deg) scale(1.04) } 92% { transform: rotate(-2deg) } }
  .ghost {
    font: 600 .9rem/1 var(--body); border-radius: 999px; padding: 12px 18px; cursor: pointer;
    background: rgba(10, 20, 48, .55); color: var(--ink); border: 1px solid rgba(243, 246, 255, .35);
    backdrop-filter: blur(6px);
  }

  /* gift voucher ticket */
  .ticket {
    display: grid; grid-template-columns: auto 1fr; width: min(100%, 30rem);
    background: var(--paper); color: var(--paper-ink); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    transform: translateY(140%) rotate(-4deg); opacity: 0;
    transition: transform .9s cubic-bezier(.2, 1.3, .35, 1), opacity .3s;
  }
  body.revealed .ticket { transform: rotate(-1.5deg); opacity: 1; transition-delay: .9s; }
  .stub {
    writing-mode: vertical-rl; transform: rotate(180deg);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 12px; background: var(--night-2); color: var(--lime);
    font-weight: 800; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase;
    border-radius: 0 18px 18px 0;
    border-left: 3px dashed var(--paper);
  }
  .ticket-body { display: grid; gap: 4px; padding: 18px 22px 18px 20px; min-width: 0; }
  .label { font-weight: 800; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: #4a5a85; }
  .amount {
    font-family: var(--display); font-size: clamp(4rem, 16vw, 6.4rem); line-height: .95;
    font-variant-numeric: tabular-nums; color: var(--paper-ink);
  }
  .amount .cur { color: #d99a06; }
  .what { font-size: 1.02rem; line-height: 1.35; font-weight: 600; }
  .specs { font-size: .78rem; color: #4a5a85; margin-top: 4px; }

  .after { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; opacity: 0; transition: opacity .5s 2.2s; }
  body.revealed .after { opacity: 1; }
  body:not(.revealed) .after { pointer-events: none; }
  .hint { font-size: .85rem; color: var(--ink); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }

  body.revealed .open { display: none; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  body.revealed #flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .9 } 100% { opacity: 0 } }

  /* "doubles fautes" beat before the reveal: driven frame-by-frame from JS */
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #tagline {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: .1em;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none; text-align: center; visibility: hidden;
    font-family: var(--display); font-size: clamp(3rem, 13vw, 8.5rem); line-height: .92; text-transform: uppercase;
    color: #fff; text-shadow: 0 6px 40px rgba(0, 0, 0, .7);
  }
  #tagline span { display: block; opacity: 0; will-change: transform, opacity; }
  #tagline .hl { color: var(--lime); }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; background: #000;
    font-family: var(--display); font-size: 1.6rem; letter-spacing: .06em; color: var(--lime);
    transition: opacity .6s;
  }
  body.ready #loading { opacity: 0; pointer-events: none; }

  @media (max-width: 560px) {
    .foot { flex-direction: column; align-items: stretch; }
    .after { align-items: stretch; text-align: center; }
    .ticket { width: 100%; }
    .btn.open { align-self: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.open { animation: none; }
    .ticket, .head .intro, .head .surprise, .after { transition-duration: .01s; transition-delay: 0s !important; }
    body.revealed #flash { animation: none; }
  }
</style>

<body>
<div id="stage"></div>
<div id="dim"></div>
<div id="tagline" aria-live="polite"><span>Prêt à faire</span><span class="hl">des doubles</span><span class="hl">fautes ?</span></div>
<div id="flash"></div>
<div id="loading">Chargement…</div>

<div class="ui">
  <header class="head">
    <div class="surprise">
      <div class="eyebrow">Ou plutôt…</div>
      <h1>Enfin réussir à faire des <em>par 3</em> !</h1>
    </div>
  </header>

  <div class="foot">

    <section class="ticket" aria-live="polite">
      <div class="stub">Bon cadeau · N° 0320</div>
      <div class="ticket-body">
        <div class="label">Ton budget</div>
        <div class="amount"><span id="count">0</span>&nbsp;<span class="cur">€</span></div>
        <div class="what">pour t'offrir ta future raquette de padel.</div>
        <div class="specs">Ronde, en goutte d'eau ou diamant : à toi de choisir.</div>
      </div>
    </section>

    <div class="after">
      <span class="hint">Glisse pour faire tourner la raquette</span>
      <button class="ghost" id="replay" type="button">Rejouer ↺</button>
    </div>
  </div>
</div>

    for (let i = 0; i < o.limbs; i++) {
      const a = i / o.limbs * Math.PI * 2 + rr(-0.3, 0.3);
      const e = new V3(C.x + Math.cos(a) * R * rr(0.4, 0.62), C.y - Ry * 0.15, C.z + Math.sin(a) * R * rr(0.4, 0.62));
      const s = tp[8 - Math.floor(rnd() * 2)];
      const m = s.clone().lerp(e, 0.5); m.y += rr(0.6, 1.4);
      const pts = bez(s, m, e, 5); tube(bark, pts, taper(5, o.r0 * 0.55, o.r0 * 0.18), 6, [1, 1, 1], 1);
      ends.push(pts[3], pts[5]);
    }
    const clumps = [];
    for (let k = 0; k < o.clumps; k++) {
      const a = rr(0, Math.PI * 2), rad = R * Math.sqrt(rr(0.02, 1));
      clumps.push(new V3(C.x + Math.cos(a) * rad, C.y + Ry * (0.55 * (1 - (rad / R) ** 2)) + rr(-0.2, 0.3), C.z + Math.sin(a) * rad));
    }
    for (const p of clumps) {
      let best = ends[0], bd = 1e9; for (const q of ends) { const d = q.distanceToSquared(p); if (d < bd) { bd = d; best = q; } }
      const m = best.clone().lerp(p, 0.5); m.y += 0.3;
      tube(bark, bez(best, m, p.clone().setY(p.y - 0.3), 3), taper(3, o.r0 * 0.18, 0.03), 4, [0.95, 0.95, 0.95], 1);
      const cr = rr(1.1, 1.7);
      for (let c = 0; c < o.cards; c++) {
        const off = randInSphere().multiplyScalar(cr); off.y *= 0.42;
        const q = p.clone().add(off);
        const rel = q.clone().sub(C), hN = clamp((rel.y + Ry * 0.4) / (Ry * 1.2)), rN = Math.hypot(rel.x, rel.z) / R;
        const ao = (0.35 + 0.65 * hN) * (0.75 + 0.25 * rN) * rr(0.88, 1.1);
        const sn = UP.clone().multiplyScalar(0.6).addScaledVector(off.clone().normalize(), 0.5).addScaledVector(new V3(rel.x, 0, rel.z).normalize(), 0.35).normalize();
        const face = UP.clone().multiplyScalar(0.55).addScaledVector(randDir(), 0.85).normalize();
        const sz = rr(0.9, 1.4);
        const cx = rnd() < 0.5 ? 0 : 0.5;
        card(leaf, q, face, sz, sz, rr(0, 7), [cx + 0.004, 0.008, cx + 0.496, 0.992], [ao * o.col[0], ao * o.col[1], ao * o.col[2]], sn);
      }
    }
    return { bark: bark.geo(), leaf: leaf.geo(), R, H, cy: C.y };
  }

  // --- palm (Phoenix-like)
  function buildPalm(o) {
    const bark = new GB(), leaf = new GB(), H = o.H;
    const la = rr(0, 7), lean = rr(0.6, 1.4);
    const top = new V3(Math.cos(la) * lean, H, Math.sin(la) * lean);
    const tp = bez(new V3(0, 0, 0), new V3(0, H * 0.5, 0), top, 10);
    const tr = tp.map((p, i) => { const t = i / 10; return 0.3 * (1 + Math.max(0, 0.12 - t) * 3) * (1 - 0.15 * t) + (t > 0.94 ? 0.12 : 0); });
    tube(bark, tp, tr, 10, [1, 1, 1], 2);
    const nF = o.fronds;
    for (let f = 0; f < nF; f++) {
      const az = f * 2.39996 + rr(-0.15, 0.15), t = f / (nF - 1);
      const el = lerp(1.15, -0.55, t) + rr(-0.12, 0.12);
      const L = rr(3.0, 4.0) * (1 - 0.15 * t * t), droop = lerp(0.25, 0.7, t);
      const dir = new V3(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
      const side = new V3().crossVectors(dir, UP).normalize();
      const shade = (0.55 + 0.45 * (1 - t)) * rr(0.88, 1.05);
      const old = t > 0.85 ? [1.15, 0.95, 0.6] : [1, 1, 1];
      const base = leaf.p.length / 3, S = 9;
      let prev = top.clone();
      for (let i = 0; i <= S; i++) {
        const s = i / S;
        const rib = top.clone().addScaledVector(dir, L * s); rib.y -= droop * L * s * s;
        const tan = i === 0 ? dir.clone() : rib.clone().sub(prev).normalize(); prev = rib.clone();
        const fold = new V3().crossVectors(side, tan).normalize(); if (fold.y < 0) fold.negate();
        const w = 0.75 * Math.pow(Math.sin(Math.PI * clamp(s * 0.92 + 0.06)), 0.6) * (L / 3.5);
        const col = [shade * old[0] * (0.8 + 0.2 * s), shade * old[1] * (0.8 + 0.2 * s), shade * old[2] * (0.8 + 0.2 * s)];
        const sn = fold.clone().multiplyScalar(0.8).addScaledVector(dir, 0.3).normalize();
        leaf.v(rib.clone().addScaledVector(side, w).addScaledVector(fold, w * 0.3), sn, 0, s, col);
        leaf.v(rib, sn, 0.5, s, col);
        leaf.v(rib.clone().addScaledVector(side, -w).addScaledVector(fold, w * 0.3), sn, 1, s, col);
      }
      for (let i = 0; i < S; i++) {
        const a = base + i * 3, b = a + 3;
        leaf.i.push(a, a + 1, b, a + 1, b + 1, b, a + 1, a + 2, b + 1, a + 2, b + 2, b + 1);
      }
    }
    return { bark: bark.geo(), leaf: leaf.geo(), R: 3, H: H + 1.5, cy: H };
  }

  // --- round shrub
  function buildShrub(o) {
    const leaf = new GB(), R = o.R, C = new V3(0, R * 0.75, 0);
    for (let k = 0; k < o.cards; k++) {
      const d = randDir(); if (d.y < -0.4) d.y = -d.y * 0.5;
      const f = 1 - Math.pow(rnd(), 2) * 0.55;
      const q = C.clone().add(new V3(d.x * R * f, d.y * R * 0.85 * f, d.z * R * f));
      const hN = (q.y) / (R * 1.6);
      const ao = (0.4 + 0.6 * f) * (0.6 + 0.4 * clamp(hN)) * rr(0.88, 1.1);
      const sn = d.clone().addScaledVector(randDir(), 0.2).normalize();
      const face = sn.clone().multiplyScalar(0.6).addScaledVector(randDir(), 0.8).normalize();
      const cell = rnd() < o.flower ? o.flowerCell : 0;
      const sz = rr(0.45, 0.7) * o.cardScale;
      card(leaf, q, face, sz, sz, rr(0, 7), cell4(cell), [ao, ao, ao], sn);
    }
    return { leaf: leaf.geo(), R, H: R * 1.6, cy: C.y };
  }

  // ------------------------------------------------------------------ templates
  const templates = {};
  const addT = (key, built, barkMat, leafMat) => { templates[key] = { ...built, barkMat, leafMat, list: [] }; };
  addT('plane1', buildBroadleaf({ R: 5.2, Ry: 4.3, trunkH: 3.2, r0: 0.42, limbs: 5, clumps: 58, cards: 24, cardScale: 1.15, clumpScale: 1.1, ph: 1.3, col: [1, 1, 1] }), barkMats.plane, matBroad);
  addT('plane2', buildBroadleaf({ R: 4.4, Ry: 4.0, trunkH: 2.8, r0: 0.36, limbs: 4, clumps: 50, cards: 24, cardScale: 1.1, clumpScale: 1.05, ph: 4.1, col: [1.04, 1.02, 0.92] }), barkMats.plane, matBroad);
  addT('oak', buildBroadleaf({ R: 4.8, Ry: 3.4, trunkH: 2.4, r0: 0.45, limbs: 6, clumps: 52, cards: 24, cardScale: 1.0, clumpScale: 1.05, ph: 2.2, col: [0.78, 0.86, 0.72] }), barkMats.oak, matBroad);
  addT('cyp1', buildCypress({ H: 15, R: 1.15, cards: 420, col: [0.95, 1, 0.95] }), barkMats.oak, matCypress);
  addT('cyp2', buildCypress({ H: 12, R: 1.0, cards: 360, col: [1.05, 1.05, 0.95] }), barkMats.oak, matCypress);
  addT('pine1', buildPine({ H: 13.5, R: 5.2, Ry: 1.7, r0: 0.3, limbs: 5, clumps: 30, cards: 30, col: [1, 1, 1] }), barkMats.pine, matPine);
  addT('pine2', buildPine({ H: 11, R: 4.2, Ry: 1.5, r0: 0.26, limbs: 4, clumps: 24, cards: 30, col: [0.95, 1.0, 0.9] }), barkMats.pine, matPine);
  addT('palm', buildPalm({ H: 8.5, fronds: 24 }), barkMats.palm, matPalm);
  addT('laurel', buildShrub({ R: 1.0, cards: 80, flower: 0, flowerCell: 0, cardScale: 1 }), null, matShrub);
  addT('oleP', buildShrub({ R: 1.15, cards: 90, flower: 0.6, flowerCell: 1, cardScale: 1.05 }), null, matShrub);
  addT('oleW', buildShrub({ R: 1.0, cards: 80, flower: 0.5, flowerCell: 2, cardScale: 1 }), null, matShrub);

  // ------------------------------------------------------------------ placement
  const placed = [];
  const outside = (x, z, m = 0) => !(Math.abs(x) < 8.5 + m && Math.abs(z) < 13.5 + m);
  function put(key, x, z, s = 1, minD = 0) {
    const t = templates[key];
    if (!outside(x, z, t.R * s * 0.9 + 0.3)) return false;
    for (const p of placed) if (Math.hypot(p.x - x, p.z - z) < Math.max(minD, (p.r + t.R * s) * 0.55)) return false;
    placed.push({ x, z, r: t.R * s });
    t.list.push({ x, z, s, rot: rr(0, Math.PI * 2), sy: rr(0.92, 1.08) });
    return true;
  }
  // far end: cypress rows framing the back, big planes behind
  for (let x = -26; x <= 26; x += rr(3.0, 3.6)) {
    if (Math.abs(x) < 5.5) continue;
    put(rnd() < 0.6 ? 'cyp1' : 'cyp2', x + rr(-0.3, 0.3), -19 + rr(-0.5, 0.5), rr(0.85, 1.12));
  }
  const fixed = [
    ['plane1', 3, -34, 1.1], ['plane2', -9, -29, 1.0], ['oak', 12, -29, 1.0], ['plane1', -15, -32, 1.05], ['plane2', 7, -37, 1.1],
    ['pine1', -3, -41, 1.1], ['pine2', 20, -36, 1.0], ['oak', -24, -38, 1.1], ['plane1', 26, -46, 1.1], ['pine1', -18, -50, 1.15],
    ['plane2', 4, -52, 1.2], ['oak', -10, -58, 1.2], ['plane1', 15, -60, 1.2],
    // left side
    ['plane1', -14.5, -7, 1.05], ['plane2', -15, 3, 1.0], ['oak', -14, 12, 0.95], ['pine2', -22, -2, 1.05], ['plane1', -24, -16, 1.1],
    ['oak', -27, 9, 1.1], ['plane2', -33, -6, 1.15], ['cyp1', -11.5, -14, 0.9], ['cyp2', -11.3, -10.5, 0.85],
    // right side
    ['palm', 12.3, -3.5, 1.0], ['palm', 13.6, 0.8, 1.15], ['palm', 12.0, 4.6, 0.92], ['plane1', 15.5, -11, 1.05], ['plane2', 17, 9, 1.05],
    ['oak', 23, -3, 1.0], ['pine1', 25, 12, 1.0], ['plane1', 30, -14, 1.15], ['cyp1', 11.5, -14.5, 0.9], ['cyp2', 11.3, 10.5, 0.9],
    // behind camera (orbit)
    ['plane2', -13, 20, 1.0], ['oak', 14, 21, 1.0], ['plane1', -25, 27, 1.1], ['pine2', 25, 28, 1.0], ['plane1', 2, 34, 1.1],
  ];
  for (const [k, x, z, s] of fixed) put(k, x, z, s);
  // distant filler ring
  const farKeys = ['plane1', 'plane2', 'oak', 'oak', 'cyp1', 'cyp2', 'pine1', 'pine2', 'plane2'];
  for (let i = 0, n = 0; i < 400 && n < 46; i++) {
    const a = rr(-Math.PI, Math.PI), r = rr(40, 95);
    const x = Math.sin(a) * r, z = -Math.cos(a) * r;
    if (z > 35) continue;
    if (put(farKeys[Math.floor(rnd() * farKeys.length)], x, z, rr(0.95, 1.35), 6)) n++;
  }
  // shrubs outside the hedges
  const shrubKeys = ['laurel', 'oleP', 'oleW', 'oleP'];
  for (let i = 0, n = 0; i < 200 && n < 26; i++) {
    let x, z;
    const side = rnd();
    if (side < 0.33) { x = rr(-14, 14); z = -15.6 - rr(0, 1.2); }
    else { x = (side < 0.66 ? -1 : 1) * rr(10.6, 11.6); z = rr(-15, 13); }
    if (put(shrubKeys[Math.floor(rnd() * shrubKeys.length)], x, z, rr(0.8, 1.2), 1.6)) n++;
  }

  // ------------------------------------------------------------------ instanced meshes
  const m4 = new THREE.Matrix4(), qq = new THREE.Quaternion(), pos = new V3(), scl = new V3(), col = new THREE.Color();
  const shadowSpots = [];
  for (const key in templates) {
    const t = templates[key];
    if (!t.list.length) continue;
    const mk = (geo, mat, isLeaf) => {
      const im = new THREE.InstancedMesh(geo, mat, t.list.length);
      im.frustumCulled = false; im.castShadow = false; im.receiveShadow = false;
      t.list.forEach((p, i) => {
        qq.setFromAxisAngle(UP, p.rot); pos.set(p.x, 0, p.z); scl.set(p.s, p.s * p.sy, p.s);
        im.setMatrixAt(i, m4.compose(pos, qq, scl));
        const v = hash(i * 7 + 3, key.length * 13);
        if (isLeaf) col.setRGB(0.9 + 0.18 * v, 0.94 + 0.1 * hash(i, 5), 0.82 + 0.2 * hash(i, 9));
        else col.setRGB(0.85 + 0.25 * v, 0.85 + 0.25 * v, 0.85 + 0.25 * v);
        im.setColorAt(i, col);
      });
      im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
      im.name = key + (isLeaf ? '_leaves' : '_bark');
      group.add(im);
    };
    if (t.bark && t.barkMat) mk(t.bark, t.barkMat, false);
    mk(t.leaf, t.leafMat, true);
    for (const p of t.list) shadowSpots.push({ x: p.x, z: p.z, r: t.R * p.s, h: t.cy * p.s });
  }

  // ------------------------------------------------------------------ hedges (world-space merged)
  {
    const gb = new GB();
    const hedge = (x0, x1, z0, z1, h) => {
      // solid core box (opaque leaf-mat cell), no bottom
      const r = [0.504, 0.004, 0.996, 0.496], c0 = [0.42, 0.45, 0.4];
      const box = [
        [[x0, 0, z1], [x1, 0, z1], [x1, h, z1], [x0, h, z1], [0, 0, 1]],
        [[x1, 0, z0], [x0, 0, z0], [x0, h, z0], [x1, h, z0], [0, 0, -1]],
        [[x1, 0, z1], [x1, 0, z0], [x1, h, z0], [x1, h, z1], [1, 0, 0]],
        [[x0, 0, z0], [x0, 0, z1], [x0, h, z1], [x0, h, z0], [-1, 0, 0]],
        [[x0, h, z1], [x1, h, z1], [x1, h, z0], [x0, h, z0], [0, 1, 0]],
      ];
      for (const f of box) {
        const n = new V3(...f[4]), i0 = gb.p.length / 3;
        const len = Math.max(Math.abs(f[1][0] - f[0][0]), Math.abs(f[1][2] - f[0][2]));
        const rep = Math.max(1, Math.round(len / 1.2));
        // split long faces into tiles so the leaf-mat cell isn't stretched
        for (let s = 0; s < rep; s++) {
          const a = s / rep, b = (s + 1) / rep, j0 = gb.p.length / 3;
          const P = (k, t) => new V3(lerp(f[0][0], f[1][0], t), f[k][1], lerp(f[0][2], f[1][2], t));
          const top = (t) => new V3(lerp(f[3][0], f[2][0], t), f[3][1], lerp(f[3][2], f[2][2], t));
          gb.v(P(0, a), n, r[0], r[1], c0.map(x => x * 0.6)); gb.v(P(1, b), n, r[2], r[1], c0.map(x => x * 0.6));
          gb.v(top(b), n, r[2], r[3], c0); gb.v(top(a), n, r[0], r[3], c0);
          gb.i.push(j0, j0 + 1, j0 + 2, j0, j0 + 2, j0 + 3);
        }
        void i0;
      }
      // fuzzy skin of leaf cards
      const L = Math.hypot(x1 - x0, z1 - z0), area = (2 * (Math.abs(x1 - x0) + Math.abs(z1 - z0)) * h + (x1 - x0) * (z1 - z0));
      const nC = Math.floor(area * 12);
      const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, hx = (x1 - x0) / 2, hz = (z1 - z0) / 2;
      for (let k = 0; k < nC; k++) {
        // random point on surface
        const face = rnd() * area; let q, n;
        const sideA = Math.abs(x1 - x0) * h, sideB = Math.abs(z1 - z0) * h;
        if (face < 2 * sideA) { const sgn = face < sideA ? 1 : -1; q = new V3(rr(x0, x1), rr(0.1, h), cz + sgn * hz); n = new V3(0, 0, sgn); }
        else if (face < 2 * sideA + 2 * sideB) { const sgn = face < 2 * sideA + sideB ? 1 : -1; q = new V3(cx + sgn * hx, rr(0.1, h), rr(z0, z1)); n = new V3(sgn, 0, 0); }
        else { q = new V3(rr(x0, x1), h, rr(z0, z1)); n = new V3(0, 1, 0); }
        q.addScaledVector(n, rr(-0.02, 0.22));
        const ao = (0.55 + 0.45 * (q.y / h)) * rr(0.85, 1.1);
        const sn = n.clone().addScaledVector(UP, 0.3).addScaledVector(randDir(), 0.25).normalize();
        const fc = n.clone().multiplyScalar(0.7).addScaledVector(randDir(), 0.7).normalize();
        const sz = rr(0.45, 0.65);
        card(gb, q, fc, sz, sz, rr(0, 7), cell4(0), [ao * 0.92, ao, ao * 0.9], sn);
      }
      void L;
    };
    hedge(-9.7, 9.7, -14.9, -14.0, 1.75);
    hedge(-9.8, -8.9, -14.9, 12.5, 1.7);
    hedge(8.9, 9.8, -14.9, 12.5, 1.7);
    const hm = new THREE.Mesh(gb.geo(), matShrub);
    hm.name = 'hedges'; hm.receiveShadow = true; hm.castShadow = false;
    group.add(hm);
  }

  // ------------------------------------------------------------------ lawn
  {
    const [c, g] = mkCanvas(512, 512);
    g.fillStyle = '#5b8a37'; g.fillRect(0, 0, 512, 512);
    for (let k = 0; k < 900; k++) { g.fillStyle = hsl(rr(80, 100), rr(35, 55), rr(26, 40), 0.25); g.beginPath(); g.arc(rnd() * 512, rnd() * 512, rr(8, 30), 0, 7); g.fill(); }
    g.lineCap = 'round';
    for (let k = 0; k < 26000; k++) {
      const x = rnd() * 512, y = rnd() * 512, l = rr(3, 9), a = rr(-0.5, 0.5) - Math.PI / 2;
      g.strokeStyle = hsl(rr(75, 105), rr(35, 60), rr(22, 48), rr(0.5, 0.9)); g.lineWidth = rr(0.8, 1.8);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    const tex = colorTex(c); tex.repeat.set(200, 200);
    const geo = new THREE.PlaneGeometry(520, 520, 130, 130); geo.rotateX(-Math.PI / 2);
    const P = geo.attributes.position, cols = new Float32Array(P.count * 3);
    for (let i = 0; i < P.count; i++) {
      const x = P.getX(i), z = P.getZ(i);
      const n = fbm(x * 0.035, z * 0.035, 4), m = fbm(x * 0.011 + 40, z * 0.011, 3);
      const b = 0.78 + 0.34 * n, y = smooth(0.5, 0.75, m) * 0.18;
      cols[i * 3] = b * (1 + y * 0.9); cols[i * 3 + 1] = b * (1 + y * 0.25); cols[i * 3 + 2] = b * (1 - y * 0.6);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const mat = new THREE.MeshStandardMaterial({ map: tex, vertexColors: true, roughness: 1, metalness: 0, envMapIntensity: 0.6 });
    mat.onBeforeCompile = (sh) => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `
        #ifdef USE_MAP
          diffuseColor *= texture2D(map, vMapUv) * 0.55 + texture2D(map, vMapUv * 0.231 + vec2(0.37, 0.11)) * 0.45;
        #endif`);
    };
    const lawn = new THREE.Mesh(geo, mat);
    lawn.position.y = -0.02; lawn.receiveShadow = true; lawn.name = 'lawn';
    group.add(lawn);
  }

  // ------------------------------------------------------------------ fake contact shadows under trees
  {
    const [c, g] = mkCanvas(128, 128);
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.7)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    const geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({ color: 0x0c1a06, alphaMap: tex, transparent: true, opacity: 0.5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const im = new THREE.InstancedMesh(geo, mat, shadowSpots.length);
    const sd = new V3(0.45, 0, -0.5).normalize(); // ground shadow direction (away from sun)
    const ang = Math.atan2(-sd.z, sd.x);
    shadowSpots.forEach((s, i) => {
      const off = s.h * 0.55;
      pos.set(s.x + sd.x * off, -0.005, s.z + sd.z * off);
      qq.setFromAxisAngle(UP, ang); scl.set(s.r * 2.6 + off * 0.6, 1, s.r * 2.1);
      im.setMatrixAt(i, m4.compose(pos, qq, scl));
    });
    im.frustumCulled = false; im.renderOrder = 1; im.name = 'tree_shadows';
    group.add(im);
  }

  // ------------------------------------------------------------------ sky colours & fog
  const C_ZEN = new THREE.Color('#2f6fc4'), C_MID = new THREE.Color('#78ade2'), C_HOR = new THREE.Color('#d3e1ea');
  const SUN = new V3(-0.45, 0.78, 0.5).normalize();

const lineBuf = lineGeo.attributes.instanceEnd.data;
const lineMat = new LineMaterial({ color: 0xffffff, linewidth: 2.4, transparent: true, fog: false, depthWrite: false });
const lines = new LineSegments2(lineGeo, lineMat); lines.frustumCulled = false; lines.renderOrder = 5; scene.add(lines);
const NSEG = cum.length;
const setLineRes = () => lineMat.resolution.set(stage.clientWidth, stage.clientHeight);
setLineRes(); addEventListener('resize', setLineRes);

// bright dot at the pen tip
const pen = new THREE.Mesh(new THREE.SphereGeometry(.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xc6ff00, fog: false }));
scene.add(pen);

// the real court rises out of the ground through the drawing
const risePlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), -0.05);
renderer.localClippingEnabled = true;
courtMod.group.traverse(o => { if (o.material) for (const m of [].concat(o.material)) { m.clippingPlanes = [risePlane]; m.clipShadows = true; m.needsUpdate = true; } });
// fog stays on the whole time (switching it off/on recompiles every shader); only its colour changes
const skyBg = scene.background, skyFog = scene.fog, skyFogCol = skyFog.color.clone(), darkBg = new THREE.Color(0x000000);

// ---------- timeline ----------
const DRAW0 = .4, DRAWA = 4.8, DRAW1 = 6.1, RISE0 = 5.7, RISE1 = 7.3, PHR = 7.2, BOOM = 9.5;
const FREEZE = new URLSearchParams(location.search).get('t');
const BUDGET = 320;
let tStart = performance.now() / 1000, revealed = false, counted = false, phrase = false;
let userRot = 0, userVel = 0, drag = null;
const countEl = document.getElementById('count');
const tagEl = document.getElementById('tagline'), tagSpans = [...tagEl.children], dimEl = document.getElementById('dim');

// distance drawn at time t (constant-ish speed, eased at the ends of each pass)
const easeSine = x => .5 - .5 * Math.cos(Math.PI * x);
const drawnAt = t => t < DRAWA ? LA * easeSine(prog(t, DRAW0, DRAWA)) : LA + (LEN - LA) * easeInOut(prog(t, DRAWA, DRAW1));
function segAt(d) { let lo = 0, hi = NSEG - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < d) lo = m + 1; else hi = m; } return lo; }
function penAt(t, out) {
  const d = drawnAt(t), i = segAt(d), c0 = i ? cum[i - 1] : 0, f = clamp((d - c0) / (cum[i] - c0)), o = i * 6;
  return out.set(SEG0[o] + (SEG0[o + 3] - SEG0[o]) * f, SEG0[o + 1] + (SEG0[o + 4] - SEG0[o + 1]) * f, SEG0[o + 2] + (SEG0[o + 5] - SEG0[o + 2]) * f);
}
// the camera looks at a time-averaged pen position: deterministic, frame-rate independent, glides over jumps between strokes
const tmpV = new THREE.Vector3(), penSm = new THREE.Vector3();
function penSmooth(t) {
  penSm.set(0, 0, 0); let wsum = 0;
  for (let i = -8; i <= 8; i++) { const dt = i * .04, w = Math.exp(-(dt * dt) / .04); penSm.addScaledVector(penAt(clamp(t + dt, 0, DRAWA), tmpV), w); wsum += w; }
  return penSm.multiplyScalar(1 / wsum);
}
let partial = -1;
function drawLines(t) {
  const d = drawnAt(t), i = segAt(d), arr = lineBuf.array;
  if (partial >= 0) arr.set(SEG0.subarray(partial * 6, partial * 6 + 6), partial * 6);
  partial = -1;
  if (d <= 0) { lineGeo.instanceCount = 0; return; }
  if (d >= LEN) { lineGeo.instanceCount = NSEG; lineBuf.needsUpdate = true; return; }
  const c0 = i ? cum[i - 1] : 0, f = clamp((d - c0) / (cum[i] - c0)), o = i * 6;
  for (let k = 0; k < 3; k++) arr[o + 3 + k] = SEG0[o + k] + (SEG0[o + 3 + k] - SEG0[o + k]) * f;
  partial = i; lineBuf.needsUpdate = true;
  lineGeo.instanceCount = i + 1;
  pen.position.set(arr[o + 3], arr[o + 4], arr[o + 5]);
}

function restart(skip) {
  tStart = performance.now() / 1000 - (skip ? BOOM : 0);
  revealed = counted = false; userRot = userVel = 0;
  document.body.classList.remove('revealed');
  countEl.textContent = '0';
}
document.getElementById('replay').addEventListener('click', () => restart(RM));

const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => {
  if (!revealed) return;
  drag = { x: e.clientX, last: performance.now() }; cvs.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
cvs.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, now = performance.now();
  userRot += dx * .012; userVel = dx * .012 / Math.max(.008, (now - drag.last) / 1000);
  drag.x = e.clientX; drag.last = now;
});
const endDrag = () => { drag = null; document.body.classList.remove('dragging'); };
cvs.addEventListener('pointerup', endDrag); cvs.addEventListener('pointercancel', endDrag);

function countUp() {
  counted = true;
  const t0 = performance.now(), dur = RM ? 1 : 1400;
  const step = () => {
    const k = clamp((performance.now() - t0) / dur);
    countEl.textContent = Math.round(BUDGET * (1 - (1 - k) ** 3));
    if (k < 1 && revealed) requestAnimationFrame(step);
  };
  step();
}

function tagline(T) {
  const on = T >= PHR && T < BOOM;
  tagEl.style.visibility = on ? 'visible' : 'hidden';
  dimEl.style.opacity = .6 * prog(T, PHR - .2, PHR + .4) * (1 - prog(T, BOOM - .25, BOOM));
  if (!on) return;
  const out = prog(T, BOOM - .3, BOOM);
  tagSpans.forEach((el, i) => {
    const k = prog(T, PHR + .1 + i * .32, PHR + .55 + i * .32);
    const s = (.55 + .45 * easeOutBack(k, 2.2)) * (1 + 1.6 * out ** 2) * (1 + .015 * Math.sin(6.283 * 1.6 * T));
    el.style.opacity = Math.min(k * 2, 1) * (1 - out);
    el.style.transform = `translateY(${(1 - k) * 30}px) scale(${s})`;
  });
}

const C = new THREE.Vector3(0, 1.2, 4.2);
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const pA = new THREE.Vector3(), lA = new THREE.Vector3(), pB = new THREE.Vector3(), lB = new THREE.Vector3(), lOver = new THREE.Vector3(0, .6, 0);
let prev = performance.now() / 1000;

function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - prev); prev = now;
  const T = FREEZE !== null ? +FREEZE : now - tStart, u = T - BOOM;

  if (u >= 0 && !revealed) { revealed = true; document.body.classList.add('revealed'); }
  if (u >= 1.1 && !counted) countUp();
  const ph = T >= PHR - .2 && u < 0;
  if (ph !== phrase) { phrase = ph; document.body.classList.toggle('phrase', ph); }
  tagline(T);

  // white strokes draw the court, then fade as the real court rises
  drawLines(T);
  pen.visible = T > DRAW0 && T < DRAW1;
  lineMat.opacity = 1 - prog(T, RISE1 - .3, RISE1 + .5);
  lines.visible = lineMat.opacity > .01 && T > DRAW0;
  courtMod.group.visible = T >= RISE0;
  risePlane.constant = -.05 + 8 * easeInOut(prog(T, RISE0, RISE1));
  surroundings.group.visible = u >= 0;
  scene.background = u >= 0 ? skyBg : darkBg;
  skyFog.color.copy(u >= 0 ? skyFogCol : darkBg);

  // racket: boom
  const hs = u < 0 ? .0001 : Math.max(.0001, .1 + .9 * easeOutBack(prog(u, 0, .7), 2.4));
  hero.scale.setScalar(hs); hero.visible = u >= 0;
  hero.position.y = .06 * Math.sin(6.283 * .5 * now) - .5 * (1 - Math.min(1, hs));
  if (!drag) { userRot += userVel * dt; userVel *= Math.pow(.04, dt); }
  const show = u < 0 ? 0 : 6.283 * easeInOut(prog(u, 1.4, 2.8));
  if (u > 2.8 && !drag && Math.abs(userVel) < .05) userRot += .25 * dt;
  hero.rotation.y = show + userRot + (RM ? 0 : .3 * Math.sin(6.283 * .2 * now));
  hero.rotation.z = RM ? 0 : .06 * Math.sin(6.283 * .35 * now);

  // camera: follow the pen → pull back over the court → dive to the racket
  const tall = camera.aspect < .7, Tc = Math.min(T, BOOM);
  const phi = .55 + .1 * Tc;
  penSmooth(Math.min(T, DRAWA));
  const fd = tall ? 8.2 : 6.4, fh = tall ? 7.4 : 5.2;
  pA.set(penSm.x + fd * Math.sin(phi), penSm.y + fh, penSm.z + fd * Math.cos(phi)); lA.copy(penSm);
  const oR = tall ? 21 : 17, oH = tall ? 18 : 12;
  pB.set(oR * Math.sin(phi), oH, oR * Math.cos(phi));
  const w1 = easeInOut(prog(T, DRAWA - .5, DRAW1 + .3));
  camPos.lerpVectors(pA, pB, w1); camLook.lerpVectors(lA, lOver, w1);
  // final approach, mostly hidden behind the tagline
  const a = RM ? 0 : .28 * Math.sin(.13 * now);
  const r = tall ? 4.3 : 3.7, lookY = tall ? 1.05 : 1.3;
  const shake = u > 0 && !RM ? .04 * Math.exp(-6 * u) * Math.sin(45 * now) : 0;
  pB.set(C.x + r * Math.sin(a), 1.45 + shake, C.z + r * Math.cos(a)); lB.set(0, lookY, 4.2);
  const w2 = easeInOut(prog(T, PHR + .2, BOOM));
  if (w2 > 0) {
    const y = camPos.y + (pB.y - camPos.y) * Math.pow(w2, 1.6);
    camPos.lerp(pB, w2).setY(y); camLook.lerp(lB, w2);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);

  updateConfetti(u);
  surroundings.update(now); courtMod.update(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// warm-up behind the loading screen: compile every shader and upload every texture now, so nothing stalls mid-animation
function warmup() {
  courtMod.group.visible = surroundings.group.visible = lines.visible = hero.visible = true;
  hero.scale.setScalar(1); risePlane.constant = 10; lineGeo.instanceCount = NSEG; updateConfetti(.4);
  renderer.compile(scene, camera);
  for (const [p, l] of [[[0, 14, 20], [0, 0, 0]], [[0, 1.45, 7.9], [0, 1.3, 4.2]]]) {
    camera.position.set(...p); camera.lookAt(...l); renderer.render(scene, camera);
  }
  skyFog.color.copy(darkBg); scene.background = darkBg; renderer.render(scene, camera);
}
warmup();

if (RM || location.hash === '#surprise') restart(true);
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.body.classList.add('ready'); prev = performance.now() / 1000;
  tStart = RM || location.hash === '#surprise' ? prev - BOOM : prev; frame();
}));
</script>

</body>
</html>
